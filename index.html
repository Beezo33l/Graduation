<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畢業快樂！前程似錦</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght=500;700&family=Poppins:wght=300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4a69bd;
            --bg-color: #f8f9fa;
            --text-color: #2f3542;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', 'Noto Serif TC', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* 音樂播放器樣式 */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .music-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }
        .music-btn:hover { transform: scale(1.1); }

        /* 首頁樣式 */
        .hero-section {
            height: 100vh;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 20px;
        }
        .hero-title {
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .hero-subtitle {
            font-size: 1.5rem;
            color: #f1f2f6;
            margin-bottom: 50px;
        }
        .scroll-down-btn {
            position: absolute;
            bottom: 40px;
            font-size: 2rem;
            color: white;
            animation: bounce 2s infinite;
            cursor: pointer;
            text-decoration: none;
        }

        /* 卡片區樣式 */
        .cards-section {
            min-height: 100vh;
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 50px;
            color: #57606f;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: var(--primary-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* 密碼卡片 */
        .gift-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            position: relative;
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }
        .gift-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        /* 鎖定遮罩層 */
        .lock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
